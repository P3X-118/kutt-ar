---
- name: Ensure Kutt paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ kutt_uid }}"
    group: "{{ kutt_gid }}"
  with_items:
    - "{{ kutt_base_path }}"
    - "{{ kutt_customization_path }}"
    - "{{ kutt_data_path }}"

- name: Ensure Kutt support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ kutt_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ kutt_uid }}"
    group: "{{ kutt_gid }}"
  with_items:
    - env
    - labels
  register: kutt_support_files_result

- name: Run if self-building of Kutt container image is not enabled
  when: "not kutt_container_image_self_build | bool"
  block:
    - name: Ensure Kutt container image is pulled via community.docker.docker_image
      when: sysd_docker_image_pull_method == 'ansible-module'
      community.docker.docker_image:
        name: "{{ kutt_container_image }}"
        source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
        force_source: "{{ kutt_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else kutt_container_image_force_pull }}"
      register: kutt_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: kutt_container_image_pull_result is not failed

    - name: Ensure Kutt container image is pulled via ansible.builtin.command
      when: sysd_docker_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ sysd_docker_host_command }} pull {{ kutt_container_image }}"
      register: kutt_container_image_pull_result
      retries: "{{ container_retry }}"
      delay: "{{ container_retry_delay }}"
      until: kutt_container_image_pull_result is not failed
      changed_when: "'Downloaded newer image' in kutt_container_image_pull_result.stdout"

- name: Run if self-building of Kutt container image is enabled
  when: "kutt_container_image_self_build | bool"
  block:
    - name: Ensure Kutt repository is present on self-build
      ansible.builtin.git:
        repo: "{{ kutt_container_image_self_build_repo }}"
        version: "{{ kutt_container_image_self_build_repo_version }}"
        dest: "{{ kutt_container_image_self_build_src_files_path }}"
        force: "yes"
      register: kutt_git_pull_results

    # Invoking the `docker build` command here, instead of calling the `docker_image` Ansible module,
    # because the latter does not support BuildKit.
    # See: https://github.com/ansible-collections/community.general/issues/514
    - name: Ensure Kutt container image is built
      ansible.builtin.shell:
        chdir: "{{ kutt_container_image_self_build_src_files_path }}"
        cmd: |
          {{ sysd_docker_host_command }} build \
          -t "{{ kutt_container_image_self_build_name }}" \
          -f Dockerfile \
          .
      environment:
        DOCKER_BUILDKIT: "1"
        PYTHON: "/usr/bin/python3"
      register: kutt_container_image_build_result
      changed_when: "'Successfully built' in kutt_container_image_build_result.stdout or ('writing image' in kutt_container_image_build_result.stderr and 'CACHED' not in kutt_container_image_build_result.stderr)"

- name: Ensure Kutt container network is created via community.docker.docker_network
  when: sysd_docker_net_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ sysd_docker_ipv6_enabled }}"
    name: "{{ kutt_container_network }}"
    driver: bridge
    driver_options: "{{ sysd_docker_net_driver_opts }}"
  register: kutt_network_creation_result

- name: Ensure Kutt container network is created via ansible.builtin.command
  when: sysd_docker_net_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ sysd_docker_host_command }} network create
      {% if sysd_docker_ipv6_enabled %}--ipv6{% endif %}
      {{ sysd_docker_net_driver_opts_string }}
      {{ kutt_container_network }}
  register: kutt_network_creation_result
  changed_when: kutt_network_creation_result.rc == 0
  failed_when: kutt_network_creation_result.rc != 0 and 'already exists' not in kutt_network_creation_result.stderr

- name: Ensure Kutt systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/kutt.service.j2"
    dest: "{{ sysd_docker_service_path }}/{{ kutt_identifier }}.service"
    mode: "0644"
  register: kutt_systemd_service_result

- name: Determine whether Kutt needs a restart
  ansible.builtin.set_fact:
    kutt_restart_necessary: >-
      {{
        kutt_support_files_result.changed | default(false)
        or kutt_systemd_service_result.changed | default(false)
        or kutt_container_image_pull_result.changed | default(false)
        or kutt_container_image_build_result.changed | default(false)
      }}
